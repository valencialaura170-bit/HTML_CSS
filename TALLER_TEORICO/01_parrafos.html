<!-- Títulos o Encabezados:
se tienen 6 tipos de encabezados, desde el h1 hasta el h6-->
<!-- (h$*6) crea 6 título en orden del 1 al 6 Emmet-->
  <h1>título</h1>
  <!-- el h1 se utiliza una sola vez por pagina web esto es debido a que el h1 tiene una importancia en el CEO lo que es el posicionamiento web, es decir, google le da mucha importancia al h1 -->
  <h2>subtitulo</h2>
  <h3>subtitulo</h3>
  <h4>subtitulo</h4>
  <h5>subtitulo</h5>
  <h6>subtitulo</h6>
  <!-- desde el h2 hasta el h6, se pueden utilizar las veces que sean necesarias según el contenido que se quiera  recrear. -->
